        <title>Exercício 14 - Números pares</title>
        <script>

            var numeros = [2, 7, 10, 15, 18, 21, 24, 31];

            function contarPares(lista) {

                var quantidade = 0;

                for (var i = 0; i < lista.length; i++) {

                    if (lista[i] % 2 == 0) {
                        quantidade++;
                    }

                }

                return quantidade;
            }

            var resultado = contarPares(numeros);

            alert("Quantidade de números pares: " + resultado);

        </script>
