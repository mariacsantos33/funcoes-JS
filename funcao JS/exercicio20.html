<html lang="pt-br" dir="ltr">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <head>
        <title>Exercício 20 - Sistema de compras</title>
        <script>

            var produtos = [25, 40, 50, 60, 80];

            function calcularTotal(lista) {

                var total = 0;

                for (var i = 0; i < lista.length; i++) {

                    total = total + lista[i];

                }

                return total;
            }

            function calcularDesconto(total) {

                var desconto = 0;

                if (total < 100) {

                    desconto = 0;

                } else if (total < 200) {

                    desconto = total * 0.10;

                } else {

                    desconto = total * 0.20;

                }

                return desconto;
            }

            var total = calcularTotal(produtos);
            var desconto = calcularDesconto(total);
            var valorFinal = total - desconto;

            alert(
                "Valor total da compra: R$ " + total.toFixed(2) +
                "\nValor do desconto: R$ " + desconto.toFixed(2) +
                "\nValor final a pagar: R$ " + valorFinal.toFixed(2)
            );

        </script>
    </head>

    <body>

    </body>
</html>
