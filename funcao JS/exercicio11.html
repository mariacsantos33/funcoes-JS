    <head>
        <title>Exercício 11 - Funções</title>
        <script>

            var num = Number(prompt("Informe um número: "))

            function tabuada(num) {
                var contador = 1
                while (contador <= 10) {
                   var operacao = num * contador
                   var contador = contador + 1
                   alert(operacao)
                }
            }

            tabuada(num)

        </script>
    </head>
</html>
