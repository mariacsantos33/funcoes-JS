        <title>Exercício 17 - Alunos aprovados</title>
        <script>

            var notas = [8, 5, 7, 4, 6, 9, 3, 10];

            function contarAprovados(lista) {

                var aprovados = 0;

                for (var i = 0; i < lista.length; i++) {

                    if (lista[i] >= 6) {
                        aprovados++;
                    }

                }

                return aprovados;
            }

            var resultado = contarAprovados(notas);

            alert("Quantidade de alunos aprovados: " + resultado);

        </script>
