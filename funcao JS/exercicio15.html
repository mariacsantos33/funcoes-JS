        <title>Exercício 15 - Soma dos números</title>
        <script>

            var numeros = [10, 20, 30, 40, 50];

            function somarNumeros(lista) {

                var soma = 0;

                for (var i = 0; i < lista.length; i++) {

                    soma = soma + lista[i];

                }

                return soma;
            }

            var resultado = somarNumeros(numeros);

            alert("Total da soma: " + resultado);

        </script>
